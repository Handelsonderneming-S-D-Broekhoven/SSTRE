name: docs-and-schemas

# Real checks only: JSON Schema validity (draft 2020-12 metaschema, synthetic
# examples, positive/negative test documents in schemas/tests/), relative
# Markdown links, a guard against committed game data, demos/savegames, large
# binaries or model weights, and REUSE (SPDX licensing metadata) compliance.
# No game data, no GPU, no secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate repository
        run: python scripts/validate_repo.py

  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install REUSE tool
        run: python -m pip install --disable-pip-version-check "reuse==5.0.2"

      - name: REUSE lint
        run: reuse lint
